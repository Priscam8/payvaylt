name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  app-and-backend-checks:
    name: App And Backend Checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: bash scripts/ci-checks.sh
